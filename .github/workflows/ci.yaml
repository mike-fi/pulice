name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13, 3.14]

    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # Install a specific version of uv.
        version: 0.9.8
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # All extras is required to have all dependencies installed for pyrefly
      run: |
        uv sync --all-extras  

    - name: Run ruff
      run: uvx ruff check .

    - name: Run pyrefly
      run: uvx pyrefly check .

    - name: Run pytest
      run: uv run pytest