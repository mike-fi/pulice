apiVersion: v1
kind: Namespace
metadata:
  name: pulice
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulice-state
  namespace: pulice
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulice-api
  namespace: pulice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulice-api
  template:
    metadata:
      labels:
        app: pulice-api
    spec:
      containers:
        - name: api
          image: pulice-k8s:latest
          imagePullPolicy: Never
          command: ["uvicorn", "pulice.api:create_api", "--factory", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: PULICE_STATE_DIR
              value: /data/pulice
            - name: PULICE_TASK_BACKEND
              value: huey
          volumeMounts:
            - name: state
              mountPath: /data/pulice
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pulice-state
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulice-worker
  namespace: pulice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulice-worker
  template:
    metadata:
      labels:
        app: pulice-worker
    spec:
      containers:
        - name: worker
          image: pulice-k8s:latest
          imagePullPolicy: Never
          command: ["huey_consumer", "pulice.worker.huey", "-w", "2", "-k", "process"]
          env:
            - name: PULICE_STATE_DIR
              value: /data/pulice
            - name: PULICE_TASK_BACKEND
              value: huey
          volumeMounts:
            - name: state
              mountPath: /data/pulice
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pulice-state
---
apiVersion: v1
kind: Service
metadata:
  name: pulice-api
  namespace: pulice
spec:
  type: NodePort
  selector:
    app: pulice-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
