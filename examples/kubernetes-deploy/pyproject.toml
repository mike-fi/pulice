[project]
name = "k8s_deploy"
version = "0.1.0"
description = "Pulice example: Kubernetes namespace management with minikube"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pulice",
    "pulumi-kubernetes>=4.18.0",
]

[project.scripts]
k8s = "k8s_deploy.cli:main"

[tool.uv.sources]
pulice = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
